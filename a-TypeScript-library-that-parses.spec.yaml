thesis: a TypeScript library that parses and formats ISO 8601 durations (e.g.
  'PT1H30M' to seconds and back), handling weeks, fractional seconds, negative
  durations, and invalid input with named errors
stories:
  - A developer passes ISO 8601 duration strings and gets exact total seconds
    for supported fixed-length units, including weeks, fractional seconds,
    negative durations, and clear named errors for invalid input.
  - A developer passes a number of seconds and gets a canonical ISO 8601
    duration string that round-trips back to the same value.
  - No visible UI shows duration input, total seconds, supported edge cases, or
    named errors.
  - No visible UI shows seconds input, canonical ISO output, or round-trip
    behavior.
  - Render a clear primary interface with a recognizable title, conversion
    controls, example inputs, outputs, and errors so the user can understand the
    library value immediately.
  - Replace the blank page with a purposeful, domain-specific developer tool or
    documentation surface that actually exposes ISO 8601 duration parsing and
    formatting behavior.
  - Both desktop and mobile should show an intentional, usable layout adapted to
    the viewport rather than an empty white canvas.
  - Show a polished, functional interface with real conversion examples and
    precise outputs so developers can trust the library behavior.
  - Render the primary developer-facing duration parser/formatter interface with
    a clear title, input, output, and example states.
  - Add visible examples and interactive conversion results that demonstrate ISO
    duration strings converting to seconds and seconds formatting back to ISO
    8601.
  - Create a mobile-specific layout with accessible controls and readable
    parse/format results within the narrow viewport.
  - Show exact sample conversions, canonical outputs, and named invalid-input
    errors in a polished developer tool layout.
scope_fence: []
requirements:
  - id: R1
    statement: Duration parser validates supported ISO 8601 duration syntax and
      returns a structured duration or named error classes for invalid input.
    acceptance:
      tier: 1
      gate: npm test -- --run tests/parse.test.ts tests/errors.test.ts
  - id: R2
    statement: Seconds converter converts parsed fixed-length durations to signed
      seconds, including weeks, days, hours, minutes, seconds, fractional
      seconds, and negative durations.
    acceptance:
      tier: 1
      gate: npm test -- --run tests/to-seconds.test.ts
  - id: R3
    statement: Formatter converts signed seconds into canonical ISO 8601 duration
      strings and preserves fractional seconds where needed.
    acceptance:
      tier: 1
      gate: npm test -- --run tests/format.test.ts tests/roundtrip.test.ts
  - id: R4
    statement: Public TypeScript API exports parseDuration, durationToSeconds,
      formatDuration, and named error classes with generated type declarations.
    acceptance:
      tier: 1
      gate: npm run typecheck && npm run build && node -e "const
        lib=require('./dist/index.js'); if (!lib.parseDuration ||
        !lib.durationToSeconds || !lib.formatDuration ||
        !lib.InvalidDurationError) process.exit(1)"
  - id: R5
    statement: "Add one primary developer-facing interface for the library: in the
      first viewport, show the recognizable ISO 8601 duration parser/formatter
      title, duration input, exact total seconds output, seconds input,
      canonical ISO output, real example conversions including
      weeks/fractional/negative cases, named invalid-input errors, and standard
      loading/empty/error behavior in a polished layout that remains usable on
      phone-width viewports."
    acceptance:
      tier: 1
      gate: npm run build --if-present
decisions:
  - id: D1
    statement: Should v1 support ISO 8601 calendar units like years and months, or
      reject them with named errors? → Reject years and date-month units in v1
      with a named UnsupportedCalendarUnitError, while fully supporting weeks
      and fixed-length day/time units.
    rationale: ser accepted
    claims: []
claims: []
open_questions: []
