thesis: a flashcard app for studying
stories:
  - She creates a deck with at least two question-and-answer flashcards and sees
    them saved.
  - She studies a deck by seeing a prompt, revealing the answer, and marking
    whether she knew it.
  - She returns later and sees cards scheduled from prior study results, with
    known cards delayed and missed cards shown sooner.
  - A user sees the product's headline value in the first viewport rather than a
    generic shell.
  - A user can scan the primary content and compare key values without reading
    long prose.
  - A user can see the key value or ranking the product promises, not just
    labels or surrounding chrome.
  - A user on a phone-sized viewport can still use the primary workflow without
    broken layout or horizontal scrolling.
  - The screenshot shows fields and buttons, but no saved deck or saved
    flashcards are visible.
  - No study prompt, reveal action, or knew/missed controls are visible.
  - No scheduled cards, prior results, or due timing information is visible.
  - The first viewport shows a generic form, not the headline value of studying
    flashcards or due-card scheduling.
  - There are no visible key values, deck counts, card counts, or due status to
    scan or compare.
  - The screen only shows labels and controls, with no visible flashcard value
    such as due cards or study progress.
  - Replace the generic form-on-plain-background shell with a purpose-built
    flashcard study interface that visibly shows decks, cards, due status, and
    review controls.
  - The screenshot shows deck and card fields, but no saved deck or saved
    flashcards are visible.
  - The screenshot still shows a generic form shell and lacks visible decks,
    cards, due status, and review controls.
  - Replace the generic plain form shell with a purpose-built study dashboard
    that visibly communicates flashcard value through decks, due cards,
    progress, and review controls.
scope_fence: []
requirements:
  - id: R1
    statement: Deck and card storage with create/list/read operations for text
      question-and-answer cards.
    acceptance:
      tier: 1
      gate: npm test -- --runTestsByPath tests/deck-storage.test.ts
        --testNamePattern='creates and reloads two decks with varied card text
        after process restart'
  - id: R2
    statement: Study session flow that selects due cards, hides answers until
      reveal, and records a remembered or missed grade.
    acceptance:
      tier: 1
      gate: npm test -- --runTestsByPath tests/study-session.test.ts
        --testNamePattern='requires reveal before grading and records remembered
        and missed outcomes'
  - id: R3
    statement: Scheduling engine that updates each card's next due time from study
      grades and persists the schedule.
    acceptance:
      tier: 1
      gate: npm test -- --runTestsByPath tests/scheduling.test.ts
        --testNamePattern='schedules missed cards sooner than remembered cards
        across two study sessions and reloads'
  - id: R4
    statement: Minimal learner interface for deck creation, card entry, due-card
      study, answer reveal, and grading.
    acceptance:
      tier: 1
      gate: npm run test:e2e -- --grep 'creates two cards, studies them with reveal,
        grades one known and one missed, then shows only due cards after reload'
  - id: R5
    statement: Input validation that rejects empty prompts or answers while
      accepting two distinct valid cards.
    acceptance:
      tier: 1
      gate: npm test -- --runTestsByPath tests/card-validation.test.ts
        --testNamePattern='rejects empty fronts and backs while accepting two
        nonempty varied cards'
  - id: R6
    statement: "The learner interface must be a purpose-built flashcard study
      workspace: in the first viewport it prominently shows the headline study
      value with visible deck names, card counts, due counts or due timing,
      current study prompt, reveal action, remembered/missed controls, and
      saved-study feedback; it must also include loading, empty, validation, and
      save-error states and remain usable on a phone-sized viewport without
      horizontal scrolling."
    acceptance:
      tier: 1
      gate: npm run build --if-present && ls tests/*ui*build*floor* >/dev/null 2>&1
  - id: R7
    statement: The scheduling engine must make remembered cards due later than
      missed cards for the same review moment, persist those next-due
      timestamps, and select due cards in earliest-due order so returning later
      produces the expected review queue.
    acceptance:
      tier: 1
      gate: test -f tests/scheduling.test.js && npm test -- scheduling
decisions:
  - id: D1
    statement: Should v1 be text-only cards, or must it support images/audio/cloze
      deletion from the start? → Text-only question-and-answer cards for v1.
    rationale: ser accepted
    claims: []
  - id: D2
    statement: Should v1 be single-device local study, or account-based cross-device
      sync? → Single-device local persistence for v1.
    rationale: ser accepted
    claims: []
  - id: D3
    statement: Should v1 optimize for manual card entry, or must it import existing
      study materials? → Manual card entry only for v1 unless the first real use
      case starts with an existing card collection.
    rationale: ser accepted
    claims: []
claims: []
open_questions: []
