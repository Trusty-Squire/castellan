<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Arb Dashboard</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <header class="header"><h1>Cross-book arbitrage</h1></header>
  <main>
    <section class="card opportunities">
      <h2>Opportunities by edge</h2>
      <ul id="opps">
        <li data-edge="4.8" data-book="DraftKings/FanDuel"><strong>4.8%</strong> Lakers ML — DraftKings vs FanDuel</li>
        <li data-edge="2.1" data-book="Caesars/BetMGM"><strong>2.1%</strong> Celtics spread — Caesars vs BetMGM</li>
      </ul>
      <p id="opps-empty" hidden>No opportunities right now — we’ll surface an edge the moment one appears.</p>
    </section>
  </main>
</body>
</html>
